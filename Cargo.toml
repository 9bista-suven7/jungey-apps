[workspace]
resolver = "2"
members = ["jungey-ui", "jungey-files", "jungey-launchpad", "jungey-center", "jungey-tasks"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
jungey-ui = { path = "jungey-ui" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
