# Jungey effects (picom v13). Installed to ~/.config/picom/picom.conf by look/effects.py.
# Every window: rounded corners, a big soft shadow, smooth open/close and resize.
# The bar, menus and Alt+Tab: frosted glass.

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

corner-radius = 12;

shadow = true;
shadow-radius = 30;
shadow-opacity = 0.5;
shadow-offset-x = -26;
shadow-offset-y = -18;
shadow-color = "#000000";

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = false;

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.08;
fade-delta = 8;

rules = (
  # the bottom bar: frosted glass behind its own rounded shape, no window shadow
  { match = "window_type = 'dock'"; corner-radius = 28; shadow = false; blur-background = true; },
  { match = "window_type = 'desktop'"; corner-radius = 0; shadow = false; },
  # menus, pop-ups, tooltips, notifications and Alt+Tab: frosted, softly shadowed
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'combo'";
    corner-radius = 14; blur-background = true; shadow-radius = 22; shadow-opacity = 0.45; },
  { match = "window_type = 'tooltip'"; corner-radius = 10; blur-background = true; shadow = false; },
  { match = "window_type = 'notification' || class_g = 'Xfce4-notifyd'"; corner-radius = 18; blur-background = true; },
  { match = "class_g = 'Xfwm4' && name = 'xfwm4-tabwin'"; corner-radius = 24; blur-background = true; },
  { match = "name = 'Whisker Menu' || class_g = 'Wrapper-2.0'"; corner-radius = 22; blur-background = true; },
  # full screen video and games: square, no effects
  { match = "fullscreen"; corner-radius = 0; shadow = false; },
  # Jungey Recorder draws on top of the screen: its see-through layers stay untouched
  { match = "name = 'Jungey ink' || name = 'Jungey camera'"; blur-background = false; shadow = false; corner-radius = 0; },
);

animations = (
  { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.94; duration = 0.2; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.94; duration = 0.15; },
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.22; },
);
