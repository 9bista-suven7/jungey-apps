<touchégg>
  <!-- Jungey touchpad gestures, modelled on macOS. Installed to ~/.config/touchegg/touchegg.conf
       by look/effects.py. Tap to click, two-finger right click and natural scrolling are touchpad
       settings (Settings > Mouse and Touchpad). Two fingers stay for scrolling, and for
       back / forward in Chrome. -->
  <settings>
    <property name="animation_delay">120</property>
    <property name="action_execute_threshold">18</property>
    <property name="color">#899041</property>
    <property name="borderColor">#C2CA6E</property>
  </settings>

  <application name="All">
    <!-- pinch with two fingers: zoom in / out (pages, documents, images) -->
    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Control_L</modifiers>
        <keys>KP_Add</keys>
        <decreaseKeys>KP_Subtract</decreaseKeys>
      </action>
    </gesture>
    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Control_L</modifiers>
        <keys>KP_Subtract</keys>
        <decreaseKeys>KP_Add</decreaseKeys>
      </action>
    </gesture>

    <!-- 3 fingers left / right: switch between open apps. The switcher's previews follow
         your fingers; lift them to land on the app. -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Tab</keys>
        <decreaseKeys>Shift+Tab</decreaseKeys>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Shift+Tab</keys>
        <decreaseKeys>Tab</decreaseKeys>
      </action>
    </gesture>

    <!-- 3 fingers up: overview of every open window (like Mission Control); keep moving to pick one -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="SEND_KEYS">
        <repeat>true</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Tab</keys>
        <decreaseKeys>Shift+Tab</decreaseKeys>
      </action>
    </gesture>
    <!-- 3 fingers down: show the desktop (again to bring the windows back) -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SHOW_DESKTOP">
        <animate>true</animate>
      </action>
    </gesture>

    <!-- 4 fingers pinch in: the Jungey menu (like Launchpad); spread out: show the desktop -->
    <gesture type="PINCH" fingers="4" direction="IN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>/home/suven/.local/bin/jungey-menu</command>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="PINCH" fingers="4" direction="OUT">
      <action type="SHOW_DESKTOP">
        <animate>true</animate>
      </action>
    </gesture>

    <!-- 4 fingers left / right: next / previous tab in the app you're in (Chrome, VS Code, Terminal...) -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L</modifiers>
        <keys>Tab</keys>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L+Shift_L</modifiers>
        <keys>Tab</keys>
        <on>begin</on>
      </action>
    </gesture>
    <!-- 4 fingers up: maximize / restore the window; down: minimize it -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="MAXIMIZE_RESTORE_WINDOW">
        <animate>true</animate>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="MINIMIZE_WINDOW">
        <animate>true</animate>
      </action>
    </gesture>
  </application>
</touchégg>
